name: Build & Push Docker Images

on:
  push:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment tag
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tag=prod" >> "$GITHUB_OUTPUT"
            echo "backend_port=8030" >> "$GITHUB_OUTPUT"
            echo "frontend_port=3030" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "backend_port=8035" >> "$GITHUB_OUTPUT"
            echo "frontend_port=3035" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Lowercase image owner
        id: owner
        run: |
          echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            PORT=${{ steps.env.outputs.backend_port }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/cargolink-backend:${{ steps.env.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.lc }}/cargolink-backend:${{ github.ref_name }}-${{ steps.env.outputs.sha }}
          cache-from: type=gha,scope=backend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=backend-${{ github.ref_name }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            PORT=${{ steps.env.outputs.frontend_port }}
            BACKEND_PORT=${{ steps.env.outputs.backend_port }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/cargolink-frontend:${{ steps.env.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.lc }}/cargolink-frontend:${{ github.ref_name }}-${{ steps.env.outputs.sha }}
          cache-from: type=gha,scope=frontend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=frontend-${{ github.ref_name }}
