name: Build & Push Docker Images

on:
  push:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/rindeplus/plataforma-backend
  FRONTEND_IMAGE: ghcr.io/rindeplus/plataforma-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment tag
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tag=prod" >> "$GITHUB_OUTPUT"
            echo "backend_port=8030" >> "$GITHUB_OUTPUT"
            echo "frontend_port=3030" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "backend_port=8035" >> "$GITHUB_OUTPUT"
            echo "frontend_port=3035" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            PORT=${{ steps.env.outputs.backend_port }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.env.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}-${{ steps.env.outputs.sha }}
          cache-from: type=gha,scope=backend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=backend-${{ github.ref_name }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            PORT=${{ steps.env.outputs.frontend_port }}
            BACKEND_PORT=${{ steps.env.outputs.backend_port }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.env.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}-${{ steps.env.outputs.sha }}
          cache-from: type=gha,scope=frontend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=frontend-${{ github.ref_name }}

  deploy-prod:
    # Corre en el self-hosted runner del server on-prem como user rindeplus.
    # Docker daemon, filesystem del repo y scripts/deploy/prod.sh son locales
    # para el runner: no hay SSH ni tunnel intermedio.
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: [self-hosted, onprem]
    environment: production   # Permite protection rules en GitHub (ej. required reviewers para deploy prod)
    timeout-minutes: 20

    steps:
      - name: Sync repo + run prod deploy script
        run: |
          set -euo pipefail
          cd ${{ vars.REPO_ROOT }}
          git fetch --prune origin
          git checkout main
          git reset --hard origin/main
          bash scripts/deploy/prod.sh

  deploy-dev:
    # Deploy continuo al stack dev tras cada push a develop.
    # Corre en el mismo self-hosted runner que deploy-prod; docker local, sin SSH.
    needs: build-and-push
    if: github.ref_name == 'develop'
    runs-on: [self-hosted, onprem]
    timeout-minutes: 15

    steps:
      - name: Sync repo + run dev deploy script
        run: |
          set -euo pipefail
          cd ${{ vars.REPO_ROOT }}
          git fetch --prune origin
          git checkout develop
          git reset --hard origin/develop
          bash scripts/deploy/dev.sh
