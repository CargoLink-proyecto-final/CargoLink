name: Deploy to GCP (Cloud Run)

# Deploy continuo a Cloud Run, con jobs separados para ver en el grafo de
# Actions qué entorno deploya y cuál se saltea según la rama:
#   build-and-push (siempre)
#        ├── deploy-dev   → corre solo en push a develop  (el de prod queda skipped)
#        └── deploy-prod  → corre solo en push a main      (el de dev queda skipped)
# Auth keyless vía Workload Identity Federation. La infra la maneja Terraform
# (infra/gcp/); este workflow solo builda y deploya la imagen (ignore_changes).

on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-gcp-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF (OIDC)

env:
  PROJECT_ID: project-9dc11c1e-5a14-4076-a74
  REGION: southamerica-east1
  WIF_PROVIDER: projects/904221754802/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SA: github-deployer@project-9dc11c1e-5a14-4076-a74.iam.gserviceaccount.com

jobs:
  # ── Build & push de las imágenes del entorno que corresponde a la rama ──
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.name }}
      backend_image: ${{ steps.be.outputs.image }}
      frontend_image: ${{ steps.fe.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment from branch
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "name=prod"            >>"$GITHUB_OUTPUT"
            echo "infix="               >>"$GITHUB_OUTPUT"
            echo "ar_repo=cargolink"     >>"$GITHUB_OUTPUT"
          else
            echo "name=dev"             >>"$GITHUB_OUTPUT"
            echo "infix=dev-"           >>"$GITHUB_OUTPUT"
            echo "ar_repo=cargolink-dev" >>"$GITHUB_OUTPUT"
          fi
          echo "sha=${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Resolve backend URL (para NEXT_PUBLIC_API_URL del frontend)
        id: backend
        run: |
          URL=$(gcloud run services describe "cargolink-${{ steps.env.outputs.infix }}backend" \
            --region="${{ env.REGION }}" --format='value(status.url)')
          if [[ -z "$URL" ]]; then echo "::error::No se encontró el backend de ${{ steps.env.outputs.name }}. ¿Está provisionado por Terraform?"; exit 1; fi
          echo "url=$URL" >>"$GITHUB_OUTPUT"

      - name: Resolve public API base URL (dominio custom o fallback .run.app)
        id: api
        run: |
          # Si el dominio custom del backend ya está vivo (LB + DNS + cert), seteá
          # la repo variable correspondiente para que el frontend se buildee con él:
          #   prod → PROD_API_BASE_URL=https://api.cargolink.com.ar
          #   dev  → DEV_API_BASE_URL=https://api.dev.cargolink.com.ar
          # Si está vacía, cae a la URL .run.app del backend (comportamiento actual).
          if [[ "${{ steps.env.outputs.name }}" == "prod" ]]; then
            OVERRIDE="${{ vars.PROD_API_BASE_URL }}"
          else
            OVERRIDE="${{ vars.DEV_API_BASE_URL }}"
          fi
          BASE="${OVERRIDE:-${{ steps.backend.outputs.url }}}"
          echo "Frontend se buildea con NEXT_PUBLIC_API_URL=${BASE}/api"
          echo "base=$BASE" >>"$GITHUB_OUTPUT"

      - name: Build & push backend image
        id: be
        run: |
          IMG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ steps.env.outputs.ar_repo }}/cargolink-backend:${{ steps.env.outputs.name }}-${{ steps.env.outputs.sha }}"
          docker build -t "$IMG" ./backend
          docker push "$IMG"
          echo "image=$IMG" >>"$GITHUB_OUTPUT"

      - name: Build & push frontend image (NEXT_PUBLIC_API_URL baked in)
        id: fe
        run: |
          IMG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ steps.env.outputs.ar_repo }}/cargolink-frontend:${{ steps.env.outputs.name }}-${{ steps.env.outputs.sha }}"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ steps.api.outputs.base }}/api" \
            -t "$IMG" ./frontend
          docker push "$IMG"
          echo "image=$IMG" >>"$GITHUB_OUTPUT"

  # ── Deploy a DEV (solo push a develop; en main queda skipped) ──
  deploy-dev:
    needs: build-and-push
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend (dev)
        run: |
          gcloud run deploy cargolink-dev-backend \
            --image="${{ needs.build-and-push.outputs.backend_image }}" \
            --region="${{ env.REGION }}" --quiet

      - name: Deploy frontend (dev)
        run: |
          gcloud run deploy cargolink-dev-frontend \
            --image="${{ needs.build-and-push.outputs.frontend_image }}" \
            --region="${{ env.REGION }}" --quiet

      - name: Summary
        run: |
          # URLs públicas: dominio custom si está seteado en repo variables, si no la .run.app.
          FE="${{ vars.DEV_FRONTEND_URL }}"; FE="${FE:-$(gcloud run services describe cargolink-dev-frontend --region=${{ env.REGION }} --format='value(status.url)')}"
          API="${{ vars.DEV_API_BASE_URL }}"; API="${API:-$(gcloud run services describe cargolink-dev-backend --region=${{ env.REGION }} --format='value(status.url)')}"
          echo "### Deploy a dev ✅" >>"$GITHUB_STEP_SUMMARY"
          echo "- Frontend: $FE" >>"$GITHUB_STEP_SUMMARY"
          echo "- API: $API" >>"$GITHUB_STEP_SUMMARY"

  # ── Deploy a PROD (solo push a main; en develop queda skipped) ──
  deploy-prod:
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend (prod)
        run: |
          gcloud run deploy cargolink-backend \
            --image="${{ needs.build-and-push.outputs.backend_image }}" \
            --region="${{ env.REGION }}" --quiet

      - name: Deploy frontend (prod)
        run: |
          gcloud run deploy cargolink-frontend \
            --image="${{ needs.build-and-push.outputs.frontend_image }}" \
            --region="${{ env.REGION }}" --quiet

      - name: Summary
        run: |
          # URLs públicas: dominio custom si está seteado en repo variables, si no la .run.app.
          FE="${{ vars.PROD_FRONTEND_URL }}"; FE="${FE:-$(gcloud run services describe cargolink-frontend --region=${{ env.REGION }} --format='value(status.url)')}"
          API="${{ vars.PROD_API_BASE_URL }}"; API="${API:-$(gcloud run services describe cargolink-backend --region=${{ env.REGION }} --format='value(status.url)')}"
          echo "### Deploy a prod ✅" >>"$GITHUB_STEP_SUMMARY"
          echo "- Frontend: $FE" >>"$GITHUB_STEP_SUMMARY"
          echo "- API: $API" >>"$GITHUB_STEP_SUMMARY"
