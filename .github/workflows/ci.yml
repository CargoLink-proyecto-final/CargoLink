# Pipeline de integración continua: compilación, lint, tests con cobertura y
# análisis estático con quality gate (SonarCloud).
#
# Corre SIEMPRE en runners hosteados por GitHub (ubuntu-latest). El runner
# self-hosted del VPS queda reservado a deploy-vps.yml: acá hay trigger
# pull_request y no puede ejecutar código no revisado con acceso a Docker.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, build, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Tests con cobertura
        run: >
          npx jest --ci --coverage
          --coverageReporters=lcov
          --coverageReporters=json-summary
          --coverageReporters=text-summary

      # Jest escribe las rutas relativas a backend/; SonarCloud las resuelve
      # desde la raíz del repo, así que se les antepone el prefijo.
      - name: Normalizar rutas del lcov
        if: ${{ !cancelled() }}
        run: sed -i 's#^SF:#SF:backend/#' coverage/lcov.info

      - name: Resumen de cobertura
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.js Backend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 30

  frontend:
    name: Frontend · lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: >
          npx jest --ci --coverage
          --coverageReporters=lcov
          --coverageReporters=json-summary
          --coverageReporters=text-summary

      - name: Normalizar rutas del lcov
        if: ${{ !cancelled() }}
        run: sed -i 's#^SF:#SF:frontend/#' coverage/lcov.info

      - name: Resumen de cobertura
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.js Frontend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 30

      # Compila aunque fallen los tests: así un test en rojo no tapa un error de build.
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  sonarcloud:
    name: SonarCloud · análisis estático y quality gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Corre aunque fallen los tests: el reporte de análisis y cobertura sirve
    # justamente para diagnosticar la corrida en rojo.
    if: ${{ !cancelled() }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo usa para decidir qué es código nuevo.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage

      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: Análisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Aviso sin token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN no configurado; se omite el análisis de SonarCloud."
