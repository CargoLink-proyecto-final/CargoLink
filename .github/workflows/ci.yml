# Pipeline de integración continua: compilación, lint, tests con cobertura y
# análisis estático con quality gate (SonarCloud).
#
# Corre SIEMPRE en runners hosteados por GitHub (ubuntu-latest). El runner
# self-hosted del VPS queda reservado a deploy-vps.yml: acá hay trigger
# pull_request y no puede ejecutar código no revisado con acceso a Docker.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      k6_profile:
        description: 'Perfil de carga de k6 (stress ~3 min, soak = esfuerzo sostenido)'
        type: choice
        options: [stress, soak]
        default: stress
      soak_duration:
        description: 'Duración de la meseta del perfil soak'
        default: 10m

permissions:
  contents: read
  pull-requests: read

# El evento va en el grupo para que un push a develop no cancele un soak
# lanzado a mano (workflow_dispatch) sobre la misma rama.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, build, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Tests con cobertura
        run: >
          npx jest --ci --coverage
          --coverageReporters=lcov
          --coverageReporters=json-summary
          --coverageReporters=text-summary

      # Jest escribe las rutas relativas a backend/; SonarCloud las resuelve
      # desde la raíz del repo, así que se les antepone el prefijo.
      - name: Normalizar rutas del lcov
        if: ${{ !cancelled() }}
        run: sed -i 's#^SF:#SF:backend/#' coverage/lcov.info

      - name: Resumen de cobertura
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.js Backend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 30

  frontend:
    name: Frontend · lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: >
          npx jest --ci --coverage
          --coverageReporters=lcov
          --coverageReporters=json-summary
          --coverageReporters=text-summary

      - name: Normalizar rutas del lcov
        if: ${{ !cancelled() }}
        run: sed -i 's#^SF:#SF:frontend/#' coverage/lcov.info

      - name: Resumen de cobertura
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.js Frontend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 30

      # Compila aunque fallen los tests: así un test en rojo no tapa un error de build.
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  sonarcloud:
    name: SonarCloud · análisis estático y quality gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Corre aunque fallen los tests: el reporte de análisis y cobertura sirve
    # justamente para diagnosticar la corrida en rojo.
    if: ${{ !cancelled() }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo usa para decidir qué es código nuevo.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage

      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: Análisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Aviso sin token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN no configurado; se omite el análisis de SonarCloud."

  stress:
    name: Stress · k6 sobre tracking de viajes
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cargolink
          POSTGRES_PASSWORD: cargolink
          POSTGRES_DB: cargolink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cargolink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales descartables: la DB vive solo durante el job.
      DATABASE_URL: postgresql://cargolink:cargolink@localhost:5432/cargolink
      JWT_SECRET: ci-stress-only
      PORT: 3001
      K6_PROFILE: ${{ inputs.k6_profile || 'stress' }}
      SOAK_DURATION: ${{ inputs.soak_duration || '10m' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

      - name: Migraciones y seed
        run: |
          npx prisma migrate deploy
          node dist/prisma/seed.js

      - name: Levantar el backend
        run: |
          nohup node dist/src/main > "$RUNNER_TEMP/backend.log" 2>&1 &
          # Sin token la API responde 401: prueba que Nest levantó y enruta.
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/api/geo/provinces)" = 401 ] && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Fixture (viaje IN_PROGRESS)
        run: echo "TRIP_ID=$(node dist/prisma/k6-fixture.js)" >> "$GITHUB_ENV"

      - name: k6 (${{ env.K6_PROFILE }})
        working-directory: .
        run: |
          # Sin pipefail el tee taparía el exit code de k6 cuando falla un umbral.
          set -o pipefail
          mkdir -p k6-results
          docker run --rm --network host -u "$(id -u)" \
            -v "$PWD:/work" -w /work \
            -e BASE_URL=http://localhost:3001/api \
            -e TRIP_ID -e PROFILE="$K6_PROFILE" -e SOAK_DURATION \
            grafana/k6:0.54.0 run \
            --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" \
            --summary-export "k6-results/$K6_PROFILE.json" \
            tests/k6/trips-location.js | tee "k6-results/$K6_PROFILE.txt"

      - name: Resumen de k6
        if: ${{ !cancelled() }}
        working-directory: .
        run: node .github/scripts/k6-summary.js "k6-results/$K6_PROFILE.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k6-${{ env.K6_PROFILE }}
          path: k6-results/
          retention-days: 30
