# Configuración de SonarCloud para el TP de Calidad de Software.
# El alcance está acotado al módulo de viajes (trips): backend, su integración
# con OSRM y las pantallas web que lo consumen.
sonar.organization=cargolink-proyecto-final
sonar.projectKey=CargoLink-proyecto-final_CargoLink
sonar.projectName=CargoLink - Trips
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/trips,backend/src/common/routing.ts,frontend/src/app/trips,frontend/src/components/trips
sonar.tests=backend/src/trips,frontend/src/app/trips,frontend/src/components/trips
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Hace fallar el job si el quality gate no pasa (bloquea el PR).
sonar.qualitygate.wait=true
