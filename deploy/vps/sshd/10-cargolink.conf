# Endurecimiento de sshd para el acceso por Cloudflare Tunnel.
# Se instala en /etc/ssh/sshd_config.d/10-cargolink.conf (ver docs/deployment.md
# § Acceso por SSH). sshd se queda con el primer valor que lee de cada opción y
# los drop-ins se leen en orden alfabético, así que el prefijo 10- le gana a
# 50-cloud-init.conf si existe.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers mfrias
